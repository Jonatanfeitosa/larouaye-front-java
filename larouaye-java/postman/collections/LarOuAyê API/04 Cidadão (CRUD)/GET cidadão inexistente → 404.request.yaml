$kind: http-request
url: "{{baseUrl}}/api/usuarios/999999"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("status 404", function(){ pm.response.to.have.status(404); });
      pm.test("erro sem stack trace", function(){ const t = pm.response.text(); pm.expect(t).to.not.include("Exception"); pm.expect(t).to.not.include("at br.com"); pm.expect(t).to.not.include("ORA-"); });
    language: text/javascript
order: 8000
