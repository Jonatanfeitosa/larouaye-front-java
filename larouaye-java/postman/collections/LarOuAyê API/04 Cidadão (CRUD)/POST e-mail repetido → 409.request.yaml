$kind: http-request
url: "{{baseUrl}}/api/usuarios"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nome": "Outra Maria",
      "email": "{{emailTeste}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("status 409", function(){ pm.response.to.have.status(409); });
      pm.test("erro sem stack trace", function(){ const t = pm.response.text(); pm.expect(t).to.not.include("Exception"); pm.expect(t).to.not.include("at br.com"); pm.expect(t).to.not.include("ORA-"); });
    language: text/javascript
order: 2000
