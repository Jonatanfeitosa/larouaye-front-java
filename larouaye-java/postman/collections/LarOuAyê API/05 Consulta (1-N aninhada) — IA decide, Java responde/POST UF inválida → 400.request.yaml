$kind: http-request
url: "{{baseUrl}}/api/usuarios/{{usuarioId}}/consultas"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "pergunta": "Como funciona o ITBI?",
      "uf": "ZZ"
    }
scripts:
  - type: afterResponse
    code: pm.test("status 400", function(){ pm.response.to.have.status(400); });
    language: text/javascript
order: 3000
