$kind: http-request
url: "{{baseUrl}}/api/usuarios/{{usuarioId}}/consultas"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "pergunta": "Quero financiar um carro",
      "uf": "SP"
    }
scripts:
  - type: afterResponse
    code: pm.test("status 201", function(){ pm.response.to.have.status(201); });
    language: text/javascript
order: 2000
