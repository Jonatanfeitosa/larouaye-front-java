$kind: http-request
url: "{{baseUrl}}/api/usuarios/{{usuarioId}}/etapas"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "etapaId": 999999,
      "status": "PENDENTE"
    }
scripts:
  - type: afterResponse
    code: pm.test("status 404", function(){ pm.response.to.have.status(404); });
    language: text/javascript
order: 4000
