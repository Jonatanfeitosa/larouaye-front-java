$kind: http-request
url: "{{baseUrl}}/api/categorias"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "codigo": "TESTE_POSTMAN",
      "nome": "Categoria de teste",
      "descricao": "Criada pelo Postman"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("status 201", function(){ pm.response.to.have.status(201); });
      pm.test("Location presente", function(){ pm.expect(pm.response.headers.has("Location")).to.be.true; });
      const json = pm.response.json(); pm.collectionVariables.set("categoriaId", json.id);
    language: text/javascript
order: 1000
