$kind: http-request
url: "{{baseUrl}}/api/orientacoes"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "categoriaId": 999999,
      "titulo": "Sem categoria",
      "perguntaRelacionada": "Pergunta?",
      "conteudo": "Conteúdo de teste com mais de dez letras."
    }
scripts:
  - type: afterResponse
    code: pm.test("status 404", function(){ pm.response.to.have.status(404); });
    language: text/javascript
order: 3000
