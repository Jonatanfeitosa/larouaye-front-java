$kind: http-request
url: "{{baseUrl}}/api/orientacoes/{{orientacaoId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "categoriaId": "{{categoriaId}}",
      "titulo": "Orientação de teste (editada)",
      "perguntaRelacionada": "Pergunta de teste?",
      "conteudo": "Conteúdo editado com mais de dez letras.",
      "cuidados": [
        "Único cuidado"
      ],
      "baseLegal": []
    }
scripts:
  - type: afterResponse
    code: pm.test("status 200", function(){ pm.response.to.have.status(200); });
    language: text/javascript
order: 7000
