$kind: http-request
url: "{{baseUrl}}/api/categorias/{{categoriaId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nome": "x"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("status 405", function(){ pm.response.to.have.status(405); });
      pm.test("erro sem stack trace", function(){ const t = pm.response.text(); pm.expect(t).to.not.include("Exception"); pm.expect(t).to.not.include("at br.com"); pm.expect(t).to.not.include("ORA-"); });
    language: text/javascript
order: 8000
