$kind: http-request
url: "{{baseUrl}}/api/etapas"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "codigo": "ETAPA_TESTE",
      "ordem": 90,
      "nome": "Etapa de teste",
      "descricao": "Criada pelo Postman",
      "documentos": [
        {
          "nome": "Documento A",
          "observacao": "Original"
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("status 201", function(){ pm.response.to.have.status(201); });
      pm.test("Location presente", function(){ pm.expect(pm.response.headers.has("Location")).to.be.true; });
      const json = pm.response.json(); pm.collectionVariables.set("etapaId", json.id);
    language: text/javascript
order: 1000
