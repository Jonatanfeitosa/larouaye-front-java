$kind: http-request
name: GET /api/saude
url: "{{baseUrl}}/api/saude"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("status 200", function(){ pm.response.to.have.status(200); });
      pm.test("banco OK", function(){ pm.expect(pm.response.json().banco).to.eql("OK"); });
    language: text/javascript
order: 1000
