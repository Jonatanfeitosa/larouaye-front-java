$kind: http-request
url: "{{baseUrl}}/api/orientacoes"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "categoriaId": "{{categoriaId}}",
      "titulo": "Orientação de teste",
      "perguntaRelacionada": "Pergunta de teste?",
      "conteudo": "Conteúdo de teste com mais de dez letras.",
      "cuidados": [
        "Primeiro cuidado",
        "Segundo cuidado"
      ],
      "baseLegal": [
        {
          "norma": "Lei 6.015/1973",
          "referencia": "Lei de Registros Públicos"
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("status 201", function(){ pm.response.to.have.status(201); });
      pm.test("Location presente", function(){ pm.expect(pm.response.headers.has("Location")).to.be.true; });
      const json = pm.response.json(); pm.collectionVariables.set("orientacaoId", json.id);
    language: text/javascript
order: 1000
