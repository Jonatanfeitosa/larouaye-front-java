$kind: http-request
url: "{{baseUrl}}/api/usuarios/{{usuarioId}}/etapas"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "etapaId": "{{etapaId}}",
      "status": "CONCLUIDA"
    }
scripts:
  - type: afterResponse
    code: pm.test("status 200", function(){ pm.response.to.have.status(200); });
    language: text/javascript
order: 2000
