$kind: http-request
url: "{{baseUrl}}/api/etapas/{{etapaId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "codigo": "ETAPA_TESTE",
      "ordem": 90,
      "nome": "Etapa de teste (editada)",
      "descricao": "Editada",
      "documentos": []
    }
scripts:
  - type: afterResponse
    code: pm.test("status 200", function(){ pm.response.to.have.status(200); });
    language: text/javascript
order: 6000
