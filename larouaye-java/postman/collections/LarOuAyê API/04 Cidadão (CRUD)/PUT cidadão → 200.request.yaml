$kind: http-request
url: "{{baseUrl}}/api/usuarios/{{usuarioId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nome": "Maria Postman Silva",
      "email": "{{emailTeste}}"
    }
scripts:
  - type: afterResponse
    code: pm.test("status 200", function(){ pm.response.to.have.status(200); });
    language: text/javascript
order: 9000
