$kind: http-request
url: "{{baseUrl}}/api/categorias"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "codigo": "x",
      "nome": ""
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("status 400", function(){ pm.response.to.have.status(400); });
      pm.test("mapa de campos", function(){ pm.expect(pm.response.json().campos).to.be.an("object"); });
      pm.test("erro sem stack trace", function(){ const t = pm.response.text(); pm.expect(t).to.not.include("Exception"); pm.expect(t).to.not.include("at br.com"); pm.expect(t).to.not.include("ORA-"); });
    language: text/javascript
order: 3000
