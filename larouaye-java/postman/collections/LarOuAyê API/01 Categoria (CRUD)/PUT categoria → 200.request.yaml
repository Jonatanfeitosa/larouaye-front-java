$kind: http-request
url: "{{baseUrl}}/api/categorias/{{categoriaId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "codigo": "TESTE_POSTMAN",
      "nome": "Categoria de teste (editada)",
      "descricao": "Editada"
    }
scripts:
  - type: afterResponse
    code: pm.test("status 200", function(){ pm.response.to.have.status(200); });
    language: text/javascript
order: 7000
