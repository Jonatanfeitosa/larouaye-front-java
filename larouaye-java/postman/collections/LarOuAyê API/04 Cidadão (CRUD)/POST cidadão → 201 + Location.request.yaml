$kind: http-request
url: "{{baseUrl}}/api/usuarios"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nome": "Maria Postman",
      "email": "{{emailTeste}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("status 201", function(){ pm.response.to.have.status(201); });
      pm.test("Location presente", function(){ pm.expect(pm.response.headers.has("Location")).to.be.true; });
      const json = pm.response.json(); pm.collectionVariables.set("usuarioId", json.id);
    language: text/javascript
  - type: beforeRequest
    code: |-
      // e-mail novo a cada rodada: a Maria da rodada anterior continua no banco (não se apaga cidadão com progresso)
      pm.collectionVariables.set('emailTeste', 'maria.' + Date.now() + '@exemplo.com');
    language: text/javascript
order: 1000
