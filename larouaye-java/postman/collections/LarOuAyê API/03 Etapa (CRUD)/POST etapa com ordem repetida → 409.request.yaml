$kind: http-request
url: "{{baseUrl}}/api/etapas"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "codigo": "OUTRA_TESTE",
      "ordem": 90,
      "nome": "Repetida",
      "descricao": "Ordem repetida"
    }
scripts:
  - type: afterResponse
    code: pm.test("status 409", function(){ pm.response.to.have.status(409); });
    language: text/javascript
order: 2000
