$kind: http-request
url: "{{baseUrl}}/api/usuarios/{{usuarioId}}/consultas"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "pergunta": "Como descubro se um imóvel tem dívidas?",
      "uf": "SP",
      "etapa": "ANALISE_DOCUMENTAL"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("status 201", function(){ pm.response.to.have.status(201); });
      pm.test("Location presente", function(){ pm.expect(pm.response.headers.has("Location")).to.be.true; });
      const json = pm.response.json(); pm.collectionVariables.set("consultaId", json.consultaId);
      pm.test("tem resposta com fonte", function(){ pm.expect(pm.response.json().status).to.be.oneOf(["RESPONDIDA","ESCLARECIMENTO","NAO_RECONHECIDA"]); });
    language: text/javascript
order: 1000
